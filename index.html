<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock_Paper_Scissors_Game</title>
        <script src="script.js" defer></script>
</head>

<body>
    <div id="mainPanel">
        <h1>Rock Paper Scissors!</h1>
        <div id="screen">
            <p id="roundsCount">Round 0</p>
            <p id="computerResponse">Computer is Thinking...</p>
            <p id="announceResult">-</p>
            <p id="playerResponse">Player is selecting...</p>
        </div>
        <div id="scores">
            <p id="playerScore">Player - 0</p>
            <p id="computerScore">Computer - 0</p>
        </div>
        <div id="choices">
            <button id="chooseRock" class="choiceButton">Rock</button>
            <button id="choosePaper" class="choiceButton">Paper</button>
            <button id="chooseScissors" class="choiceButton">Scissors</button>
        </div>
        <div id="selectMatchPoint">
            <button id="first-to-3">First To 3 pts.</button>
            <button id="first-to-5">First to 5 pts.</button>
            <button id="customMatchPoint">Custom</button>
        </div>
    </div>
</body>

</html>
